; Swarm v1 — ESP32-S3 Super Mini (Artificial Emotion Controller v1 PCB)
;
; Flash size is NOT assumed proven for every Super Mini clone.
; Default env uses a 4 MB dual-OTA layout that is common for these boards.
; Verify flash before ceiling install: see docs/OTA.md and README.md

[platformio]
default_envs = swarm_s3_4mb_ota
src_dir = src

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
lib_deps =
	bblanchon/ArduinoJson@7.3.0
	links2004/WebSockets@2.4.1
build_flags =
	-I include
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D SWARM_FW_VERSION=\"0.2.0\"
	-D CORE_DEBUG_LEVEL=0
monitor_filters = esp32_exception_decoder

; Primary target: ESP32-S3 Super Mini class boards (4 MB flash assumed until verified).
[env:swarm_s3_4mb_ota]
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_upload.flash_size = 4MB
board_build.partitions = partitions/swarm_4mb_ota.csv
build_flags =
	${env.build_flags}
	-D SWARM_FLASH_SIZE_MB=4

; Alternate: 8 MB Super Mini / DevKit variants (enable only after flash_id confirms 8 MB).
[env:swarm_s3_8mb_ota]
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_build.partitions = partitions/swarm_8mb_ota.csv
build_flags =
	${env.build_flags}
	-D SWARM_FLASH_SIZE_MB=8

; Host-side regression tests (no hardware). Run: pio test -e native_host
[env:native_host]
platform = native
framework =
test_framework = unity
test_build_src = false
lib_deps =
	throwtheswitch/Unity@^2.6.1
build_flags =
	-I include
	-I src
	-D UNIT_TEST
	-std=c++17
